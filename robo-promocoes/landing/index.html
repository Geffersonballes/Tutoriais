<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Para outro cliente: trocar título, descrição, endereço e imagem destas 8 linhas (quem gera a prévia do link não roda JavaScript) -->
<title>Achadinhos da Lay | Pare de caçar promoção, ela chega até você</title>
<meta name="description" content="Grupo gratuito no WhatsApp com ofertas com desconto selecionadas todo dia. Grupo independente, com links de afiliado.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://achadinhosdalay.ballestech.com.br/">
<meta property="og:title" content="Achadinhos da Lay | Pare de caçar promoção, ela chega até você">
<meta property="og:description" content="Ofertas com desconto escolhidas todo dia, direto no seu WhatsApp. Grátis, só admins postam.">
<meta property="og:image" content="https://achadinhosdalay.ballestech.com.br/og.jpg">
<meta name="theme-color" content="#0B0B0B">
<!-- Tudo que muda por cliente fica em config.js -->
<script src="config.js"></script>
<script>/* aplica as cores antes de desenhar (evita piscar) */
(function(K,r){K=(window.LANDING||{}).cores||{};r=document.documentElement.style;
[["fundo","--fundo"],["texto","--texto"],["destaque","--destaque"],["botao","--botao"],["botaoTexto","--botao-texto"]].forEach(function(c){if(K[c[0]])r.setProperty(c[1],K[c[0]])})})();</script>
<style>
  :root{
    --fundo:#0B0B0B; --texto:#FFF6DD; --destaque:#FFC21A; --botao:#FFC21A; --botao-texto:#111;
    --destaque-claro:color-mix(in srgb,var(--destaque) 55%,#fff);
    --destaque-escuro:color-mix(in srgb,var(--destaque) 70%,#000);
    --suave:color-mix(in srgb,var(--texto) 68%,var(--fundo));
    --vidro:color-mix(in srgb,var(--texto) 7%,transparent);
    --linha:color-mix(in srgb,var(--destaque) 24%,transparent);
    --brilho:color-mix(in srgb,var(--destaque) 45%,transparent);
    --fonte:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--fonte);background:var(--fundo);color:var(--texto);line-height:1.5;font-size:17px;overflow-x:hidden}
  a{color:inherit}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ===== UMA TELA SÓ ===== */
  .tela{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
  .tela::before{content:"";position:absolute;left:50%;top:-200px;width:820px;height:640px;transform:translateX(-50%);
    background:radial-gradient(closest-side,var(--brilho),transparent);z-index:-2;pointer-events:none}
  .piso{position:absolute;left:-50%;right:-50%;bottom:-2px;height:55%;z-index:-1;pointer-events:none;perspective:320px;perspective-origin:50% 0;
    -webkit-mask-image:linear-gradient(to top,#000 25%,transparent);mask-image:linear-gradient(to top,#000 25%,transparent)}
  .piso i{position:absolute;inset:0 0 -60%;transform:rotateX(62deg);transform-origin:50% 0;
    background-image:linear-gradient(var(--linha) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--linha) 1.5px,transparent 1.5px);
    background-size:56px 56px;animation:anda 3.2s linear infinite}
  @keyframes anda{to{background-position:0 56px}}
  .estrelas span{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--destaque-claro);box-shadow:0 0 8px var(--destaque);
    opacity:0;animation:pisca 4s ease-in-out infinite;z-index:-1}
  @keyframes pisca{50%{opacity:.9}}

  .conteudo{flex:1;display:grid;align-content:center;justify-items:center;text-align:center;gap:4px;
    width:100%;max-width:1120px;margin:0 auto;padding:14px 18px 6px}

  /* Logo 3D */
  .palco{position:relative;width:min(124px,32vw);aspect-ratio:1;perspective:900px}
  .cena{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s ease-out}
  .anel{position:absolute;inset:4%;border-radius:50%;border:1.5px solid var(--linha);
    box-shadow:0 0 24px color-mix(in srgb,var(--destaque) 18%,transparent),inset 0 0 24px color-mix(in srgb,var(--destaque) 12%,transparent)}
  .anel::after{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;border-radius:50%;background:var(--destaque-claro);box-shadow:0 0 14px 3px var(--destaque)}
  .a1{animation:gira1 14s linear infinite}
  .a2{inset:-8%;border-style:dashed;opacity:.7;animation:gira2 22s linear infinite}
  @keyframes gira1{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
  @keyframes gira2{from{transform:rotateY(68deg) rotateZ(0)}to{transform:rotateY(68deg) rotateZ(-360deg)}}
  .logo{position:absolute;inset:6%;display:grid;place-items:center;border-radius:50%;transform:translateZ(50px);animation:flutua 6s ease-in-out infinite;
    background:var(--destaque);color:#111;font-weight:900;font-size:44px}
  .logo.com-img{background:none}
  .logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 26px rgba(0,0,0,.6)) drop-shadow(0 0 26px color-mix(in srgb,var(--destaque) 35%,transparent));
    -webkit-mask-image:radial-gradient(closest-side,#000 82%,transparent 100%);mask-image:radial-gradient(closest-side,#000 82%,transparent 100%)}
  @keyframes flutua{50%{transform:translateZ(50px) translateY(-8px)}}

  .selo{display:inline-flex;align-items:center;gap:8px;font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
    padding:8px 13px;border-radius:99px;background:var(--vidro);border:1px solid var(--linha);margin-top:6px}
  .selo i{width:8px;height:8px;border-radius:50%;background:#25D366;box-shadow:0 0 0 0 rgba(37,211,102,.6);animation:pulso 2s infinite}
  @keyframes pulso{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

  /* Frase de impacto */
  h1{font-size:clamp(34px,10.2vw,78px);line-height:.98;letter-spacing:-.035em;font-weight:900;margin-top:10px;text-wrap:balance;
    text-shadow:0 2px 30px rgba(0,0,0,.5)}
  h1 .dourado{display:block;background:linear-gradient(100deg,var(--destaque-claro),var(--destaque) 35%,#FFE38A 55%,var(--destaque) 75%,var(--destaque-claro));
    -webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:ouro 5s linear infinite;
    filter:drop-shadow(0 0 18px color-mix(in srgb,var(--destaque) 35%,transparent))}
  @keyframes ouro{to{background-position:-200% 0}}
  .sub{font-size:clamp(16px,4.3vw,20px);line-height:1.4;color:var(--suave);max-width:30ch;margin-top:10px;text-wrap:pretty}

  .destaques{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px;max-width:520px}
  .destaques li{font-weight:800;font-size:13px;padding:6px 11px;border-radius:12px;background:var(--vidro);border:1px solid var(--linha);
    box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 10%,transparent);animation:entra .6s var(--ease) both}
  .destaques li:nth-child(2){animation-delay:.12s}.destaques li:nth-child(3){animation-delay:.24s}
  @keyframes entra{from{opacity:0;transform:perspective(600px) translateY(14px) rotateX(30deg)}}

  /* Botão (único CTA) */
  .cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:440px;
    min-height:60px;margin-top:16px;padding:14px 24px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;
    background:linear-gradient(180deg,var(--destaque-claro),var(--botao) 45%,var(--destaque-escuro));color:var(--botao-texto);font:900 20px/1.2 var(--fonte);
    box-shadow:0 6px 0 color-mix(in srgb,var(--destaque-escuro) 70%,#000),0 14px 34px var(--brilho),inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .15s var(--ease),box-shadow .15s var(--ease),filter .15s;animation:chama 2.6s ease-in-out infinite}
  @keyframes chama{50%{box-shadow:0 6px 0 color-mix(in srgb,var(--destaque-escuro) 70%,#000),0 14px 50px var(--destaque),inset 0 1px 0 rgba(255,255,255,.6)}}
  .cta::after{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:varre 3.4s ease-in-out infinite}
  @keyframes varre{0%,55%{left:-60%}100%{left:130%}}
  .cta:hover{filter:brightness(1.06);transform:translateY(-2px)}
  .cta:active{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--destaque-escuro) 70%,#000),0 6px 16px var(--brilho)}
  .cta:focus-visible{outline:3px solid var(--texto);outline-offset:4px}
  .cta svg{width:24px;height:24px;flex:none;position:relative}
  .cta span{position:relative}
  .cta[aria-disabled="true"]{background:color-mix(in srgb,var(--texto) 30%,var(--fundo));box-shadow:none;cursor:default;animation:none}
  .cta[aria-disabled="true"]::after{display:none}
  .abaixo{font-size:13px;color:var(--suave);margin-top:10px}

  /* Rodapé pequeno, dentro da mesma tela */
  .aviso{font-size:11px;line-height:1.4;color:color-mix(in srgb,var(--texto) 52%,var(--fundo));text-align:center;
    max-width:760px;margin:0 auto;padding:8px 18px calc(10px + env(safe-area-inset-bottom))}
  .aviso p+p{margin-top:4px}
  .aviso a{color:var(--destaque)}

  @media (max-height:700px){ .palco{width:min(84px,23vw)} h1{font-size:clamp(30px,9.2vw,52px)} .sub{font-size:15px} .destaques{margin-top:10px} .cta{margin-top:12px;min-height:56px} }
  @media (min-width:860px){
    h1{font-size:clamp(56px,6vw,84px)}
    .conteudo{grid-template-columns:1.3fr .7fr;text-align:left;justify-items:start;align-content:center;column-gap:40px}
    .palco{grid-column:2;grid-row:1 / span 7;width:min(420px,100%);justify-self:center;align-self:center}
    .hero-txt{grid-column:1}
    .destaques{justify-content:flex-start}
  }
  .hero-txt{display:flex;flex-direction:column;align-items:inherit}
  @media (min-width:860px){ .hero-txt{align-items:flex-start} }
  @media (max-width:859px){ .hero-txt{align-items:center} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
  .oculto{display:none!important}
</style>
</head>
<body>

<main class="tela">
  <div class="piso" aria-hidden="true"><i></i></div>
  <div class="estrelas" id="estrelas" aria-hidden="true"></div>
  <div class="conteudo">
    <div class="palco" aria-hidden="true">
      <div class="cena" id="cena"><div class="anel a2"></div><div class="anel a1"></div><div class="logo" id="logo"></div></div>
    </div>
    <div class="hero-txt">
      <span class="sr" data-t="marca"></span>
      <div class="selo"><i></i><span data-t="selo"></span></div>
      <h1 id="titulo" data-t="titulo"></h1>
      <p class="sub" data-t="subtitulo"></p>
      <ul class="destaques" id="destaques"></ul>
      <a class="cta js-cta" id="cta-topo" href="#" data-local="topo"></a>
      <p class="abaixo" data-t="abaixoDoBotao"></p>
    </div>
  </div>
  <footer class="aviso">
    <p data-t="aviso"></p>
    <p><span id="aviso-pixel" class="oculto">Usamos o Pixel da Meta para medir visitas e cliques dos nossos anúncios. </span>Esta página não pede nenhum dado seu.
      <span id="link-ig" class="oculto">· <a href="#" target="_blank" rel="noopener">Instagram</a></span> · © <span id="ano"></span> <span data-t="marca"></span></p>
  </footer>
</main>

<script>
(function(){
  var C = window.LANDING || {}, M = C.marca || {}, T = C.textos || {}, K = C.cores || {};
  T.marca = M.nome || "";

  // Textos
  document.querySelectorAll("[data-t]").forEach(function(el){ var v = T[el.dataset.t]; if (v) el.textContent = v; });
  // Título: o trecho entre [colchetes] em config.js fica dourado, em linha própria
  var h1 = document.getElementById("titulo"), m = (T.titulo || "").match(/^(.*)\[(.+)\](.*)$/);
  if (m) { h1.textContent = m[1]; var d = document.createElement("span"); d.className = "dourado"; d.textContent = m[2]; h1.appendChild(d); if (m[3]) h1.appendChild(document.createTextNode(m[3])); }
  var lista = document.getElementById("destaques");
  (T.destaques || []).forEach(function(t){ var li = document.createElement("li"); li.textContent = t; lista.appendChild(li); });
  if (!lista.children.length) lista.remove();
  document.getElementById("ano").textContent = new Date().getFullYear();

  // Logo
  var logo = document.getElementById("logo");
  if (M.logo) { var im = new Image(); im.src = M.logo; im.alt = ""; im.width = 300; im.height = 300; im.fetchPriority = "high"; logo.classList.add("com-img"); logo.appendChild(im); }
  else logo.textContent = M.iniciais || (M.nome || "?").charAt(0);
  if (M.instagram) { var ig = document.getElementById("link-ig"); ig.classList.remove("oculto"); ig.querySelector("a").href = M.instagram; }

  // UTM (vem do link: ?utm_source=instagram&utm_medium=bio ...)
  var q = new URLSearchParams(location.search), utm = {};
  ["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(function(k){ if (q.get(k)) utm[k] = q.get(k); });

  // Rodízio: primeiro grupo que não está cheio
  var grupo = (C.grupos || []).filter(function(g){ return !g.cheio; })[0];
  var icone = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3Z"/></svg>';
  var a = document.getElementById("cta-topo");
  if (grupo && grupo.link) {
    a.innerHTML = icone + "<span></span>"; a.querySelector("span").textContent = T.botao || "Entrar no grupo";
    a.href = grupo.link; a.rel = "noopener";
  } else if (grupo) { // prévia: link ainda não configurado
    a.innerHTML = icone + "<span></span>"; a.querySelector("span").textContent = T.botao || "Entrar no grupo";
    a.addEventListener("click", function(e){ e.preventDefault(); alert("Prévia: o link do grupo ainda não foi configurado em config.js"); });
  } else {
    a.textContent = T.todosCheios || "Grupos cheios"; a.setAttribute("aria-disabled","true");
    a.addEventListener("click", function(e){ e.preventDefault(); });
  }

  // Pixel da Meta (só carrega se houver ID) — ATENÇÃO: antes de preencher pixelId, criar o banner de consentimento (parecer da conformidade)
  if (C.pixelId) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
    s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', C.pixelId); fbq('track', 'PageView');
    document.getElementById("aviso-pixel").classList.remove("oculto");
  }

  // Clique no botão → evento "Lead" no Pixel (com a origem UTM e o grupo), depois abre o WhatsApp
  a.addEventListener("click", function(e){
    if (!grupo || !grupo.link) return;
    var dados = Object.assign({ content_name: grupo.nome || "grupo", botao: "topo" }, utm);
    if (window.fbq) {
      e.preventDefault();
      fbq('track', 'Lead', dados); fbq('trackCustom', 'EntrarNoGrupo', dados);
      setTimeout(function(){ location.href = grupo.link; }, 350);
    }
  });

  var calmo = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!calmo) {
    var est = document.getElementById("estrelas");
    for (var s = 0; s < 22; s++) {
      var sp = document.createElement("span");
      sp.style.left = (Math.random() * 100) + "%"; sp.style.top = (Math.random() * 70) + "%";
      sp.style.animationDelay = (Math.random() * 4).toFixed(2) + "s"; sp.style.transform = "scale(" + (0.5 + Math.random()).toFixed(2) + ")";
      est.appendChild(sp);
    }
    // A logo segue o mouse/dedo
    var cena = document.getElementById("cena"), tela = document.querySelector(".tela");
    tela.addEventListener("pointermove", function(e){
      var x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
      cena.style.transform = "rotateY(" + (x * 24).toFixed(1) + "deg) rotateX(" + (-y * 18).toFixed(1) + "deg)";
    });
    tela.addEventListener("pointerleave", function(){ cena.style.transform = ""; });
  }
})();
</script>
</body>
</html>
