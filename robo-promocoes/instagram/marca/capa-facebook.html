<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1640px;height:624px;overflow:hidden;font-family:Poppins,DejaVu Sans,sans-serif;
 background:radial-gradient(circle at 72% 50%,rgba(255,194,26,.22) 0,transparent 38%),radial-gradient(circle at 10% 0%,rgba(255,194,26,.10) 0,transparent 40%),#0B0B0B}
.wrap{position:absolute;left:300px;right:220px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between}
.selo{display:inline-block;border:2px solid #FFC21A;color:#FFC21A;font-weight:700;font-size:22px;padding:6px 18px;border-radius:999px;letter-spacing:.5px}
h1{color:#FFF6DD;font-weight:800;font-size:60px;line-height:1.05;margin-top:18px;letter-spacing:-1px}
h1 em{font-style:normal;color:#FFC21A}
p{color:#FFF6DD;opacity:.85;font-size:26px;font-weight:500;margin-top:16px;max-width:720px}
.cta{display:inline-block;margin-top:26px;background:#FFC21A;color:#111;font-weight:800;font-size:28px;padding:14px 32px;border-radius:999px;box-shadow:0 0 40px rgba(255,194,26,.35)}
.logo{width:460px;height:460px;border-radius:50%;object-fit:cover;
 -webkit-mask-image:radial-gradient(circle,#000 62%,transparent 71%);mask-image:radial-gradient(circle,#000 62%,transparent 71%)}
</style></head><body>
<div class="wrap">
 <div>
  <span class="selo">GRUPO GRATUITO NO WHATSAPP</span>
  <h1>Pare de caçar promoção.<br><em>Ela chega até você.</em></h1>
  <p>Achadinhos da Shopee escolhidos todo dia para casa, beleza e criançada.</p>
  <div class="cta">Entre no grupo de ofertas</div>
 </div>
 <img class="logo" src="logo.webp" alt="">
</div></body></html>
