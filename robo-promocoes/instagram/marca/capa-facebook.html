<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1640px;height:624px;overflow:hidden;font-family:Poppins,DejaVu Sans,sans-serif;
 background:radial-gradient(circle at 15% 20%,#ff9aae 0,transparent 45%),radial-gradient(circle at 90% 90%,#ffc27a 0,transparent 50%),linear-gradient(120deg,#ff7a93,#f2a65a);}
.wrap{position:absolute;left:230px;right:230px;top:0;bottom:0;display:flex;align-items:center;justify-content:space-between}
h1{color:#fff;font-weight:800;font-size:92px;line-height:.95;letter-spacing:-1px;text-shadow:0 6px 24px rgba(160,30,70,.25)}
h1 span{display:block;font-size:56px;font-weight:700;letter-spacing:0;opacity:.95}
p{color:#fff;font-size:28px;font-weight:500;margin-top:22px;max-width:640px}
.cta{display:inline-block;margin-top:28px;background:#fff;color:#e8456b;font-weight:800;font-size:28px;padding:14px 30px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.cards{position:relative;width:420px;height:420px}
.card{position:absolute;background:#fff;border-radius:28px;box-shadow:0 18px 40px rgba(120,30,60,.25);padding:22px 26px;font-weight:700;color:#333}
.c1{left:10px;top:20px;transform:rotate(-6deg);width:300px}
.c1 small{display:block;color:#999;font-size:24px;font-weight:600}
.c1 b{color:#1b9e4b;font-size:46px}
.c2{right:0;top:170px;transform:rotate(5deg);background:#e8456b;color:#fff;font-size:44px;font-weight:800;padding:16px 30px}
.c3{left:0;bottom:10px;transform:rotate(-2deg);font-size:28px;color:#e8456b;white-space:nowrap}
</style></head><body>
<div class="wrap">
 <div>
  <h1>Achadinhos<span>da Lay</span></h1>
  <p>Ofertas da Shopee que valem a pena para casa, beleza, criançada e utilidades.</p>
  <div class="cta">Entre no grupo de ofertas do WhatsApp</div>
 </div>
 <div class="cards">
  <div class="card c1"><small>achadinho</small>até <b>R$ 20</b></div>
  <div class="card c2">até -70%</div>
  <div class="card c3">🏆 Top 5 achadinhos do dia</div>
 </div>
</div></body></html>
